<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .banner-text {
      font-family: Verdana, Geneva, sans-serif;
      fill: #EFE6D8;
      animation: fadeIn 1.4s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect width="1200" height="200" fill="#4A6670"/>

  <path fill="#5c7d89" opacity="0.5">
    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      keyTimes="0;0.333;0.667;1"
      values="
        M0,150 C200,190 400,110 600,150 C800,190 1000,110 1200,150 L1200,200 L0,200 Z;
        M0,110 C200,70 400,170 600,110 C800,70 1000,170 1200,110 L1200,200 L0,200 Z;
        M0,190 C200,150 400,90 600,190 C800,150 1000,90 1200,190 L1200,200 L0,200 Z;
        M0,150 C200,190 400,110 600,150 C800,190 1000,110 1200,150 L1200,200 L0,200 Z" />
  </path>

  <path fill="#35505A" opacity="0.5">
    <animate
      attributeName="d"
      dur="6s"
      begin="-3s"
      repeatCount="indefinite"
      keyTimes="0;0.333;0.667;1"
      values="
        M0,165 C200,130 400,195 600,165 C800,130 1000,195 1200,165 L1200,200 L0,200 Z;
        M0,185 C200,150 400,210 600,185 C800,150 1000,210 1200,185 L1200,200 L0,200 Z;
        M0,140 C200,105 400,175 600,140 C800,105 1000,175 1200,140 L1200,200 L0,200 Z;
        M0,165 C200,130 400,195 600,165 C800,130 1000,195 1200,165 L1200,200 L0,200 Z" />
  </path>

  <text x="50%" y="72" text-anchor="middle" class="banner-text" font-size="44" font-weight="700">Yesica Garate</text>
  <text x="50%" y="115" text-anchor="middle" class="banner-text" font-size="22" font-weight="700">Ingeniería Informática — Ingeniería del Software</text>
  <text x="50%" y="147" text-anchor="middle" class="banner-text" font-size="22" font-weight="700">Universidad de Sevilla</text>
</svg>
