<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .banner-text {
      font-family: Verdana, Geneva, sans-serif;
      fill: #EFE6D8;
      animation: fadeIn 1.4s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect width="1200" height="200" fill="#4A6670"/>

  <path fill="#5c7d89" opacity="0.55">
    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      keyTimes="0;0.333;0.667;1"
      values="
        M0,130 C200,175 400,90 600,130 C800,175 1000,90 1200,130 L1200,200 L0,200 Z;
        M0,90 C200,50 400,150 600,90 C800,50 1000,150 1200,90 L1200,200 L0,200 Z;
        M0,170 C200,135 400,70 600,170 C800,135 1000,70 1200,170 L1200,200 L0,200 Z;
        M0,130 C200,175 400,90 600,130 C800,175 1000,90 1200,130 L1200,200 L0,200 Z" />
  </path>

  <path fill="#5c7d89" opacity="0.4">
    <animate
      attributeName="d"
      dur="9s"
      repeatCount="indefinite"
      keyTimes="0;0.333;0.667;1"
      values="
        M0,180 C200,145 400,210 600,180 C800,145 1000,210 1200,180 L1200,200 L0,200 Z;
        M0,200 C200,165 400,225 600,200 C800,165 1000,225 1200,200 L1200,200 L0,200 Z;
        M0,155 C200,120 400,190 600,155 C800,120 1000,190 1200,155 L1200,200 L0,200 Z;
        M0,180 C200,145 400,210 600,180 C800,145 1000,210 1200,180 L1200,200 L0,200 Z" />
  </path>

  <text x="50%" y="72" text-anchor="middle" class="banner-text" font-size="44" font-weight="700">Yesica Garate</text>
  <text x="50%" y="115" text-anchor="middle" class="banner-text" font-size="22" font-weight="700">Ingeniería Informática — Ingeniería del Software</text>
  <text x="50%" y="147" text-anchor="middle" class="banner-text" font-size="22" font-weight="700">Universidad de Sevilla</text>
</svg>
