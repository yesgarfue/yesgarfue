<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .banner-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #F4F1DE;
      animation: fadeIn 1.4s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect width="1200" height="200" fill="#3A5A40"/>

  <path fill="#4a6b52" opacity="0.5">
    <animate
      attributeName="d"
      dur="20s"
      repeatCount="indefinite"
      keyTimes="0;0.333;0.667;1"
      values="
        M0,150 C200,180 400,120 600,150 C800,180 1000,120 1200,150 L1200,200 L0,200 Z;
        M0,140 C200,110 400,170 600,140 C800,110 1000,170 1200,140 L1200,200 L0,200 Z;
        M0,160 C200,190 400,130 600,160 C800,190 1000,130 1200,160 L1200,200 L0,200 Z;
        M0,150 C200,180 400,120 600,150 C800,180 1000,120 1200,150 L1200,200 L0,200 Z" />
  </path>

  <path fill="#588157" opacity="0.45">
    <animate
      attributeName="d"
      dur="20s"
      begin="-10s"
      repeatCount="indefinite"
      keyTimes="0;0.333;0.667;1"
      values="
        M0,165 C200,140 400,190 600,165 C800,140 1000,190 1200,165 L1200,200 L0,200 Z;
        M0,175 C200,150 400,200 600,175 C800,150 1000,200 1200,175 L1200,200 L0,200 Z;
        M0,155 C200,130 400,180 600,155 C800,130 1000,180 1200,155 L1200,200 L0,200 Z;
        M0,165 C200,140 400,190 600,165 C800,140 1000,190 1200,165 L1200,200 L0,200 Z" />
  </path>

  <text x="50%" y="72" text-anchor="middle" class="banner-text" font-size="42" font-weight="700">Yesica Garate</text>
  <text x="50%" y="115" text-anchor="middle" class="banner-text" font-size="19" font-weight="700">Ingeniería Informática — Ingeniería del Software</text>
  <text x="50%" y="142" text-anchor="middle" class="banner-text" font-size="16" font-weight="400" opacity="0.9">Universidad de Sevilla</text>
</svg>
